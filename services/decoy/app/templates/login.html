<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In &lsaquo; Corporate WordPress Portal &#8212; WordPress</title>
    <style>
        body {
            background: #f0f0f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #fff;
            padding: 26px 24px 34px;
            box-shadow: 0 1px 3px rgba(0,0,0,.13);
            width: 320px;
            border: 1px solid #c3c4c7;
        }
        .logo-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            color: #2271b1;
        }
        .error-banner {
            background: #fff;
            border-left: 4px solid #d63638;
            padding: 12px;
            margin-bottom: 20px;
            box-shadow: 0 1px 1px 0 rgba(0,0,0,.05);
            font-size: 13px;
            line-height: 1.5;
        }
        label {
            font-size: 14px;
            line-height: 1.5;
            color: #3c434a;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 6px 10px;
            font-size: 18px;
            line-height: 1.33333333;
            border: 1px solid #8c8f94;
            box-sizing: border-box;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .btn-submit {
            background: #2271b1;
            border-color: #2271b1;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            line-height: 2;
            cursor: pointer;
            border-width: 1px;
            border-style: solid;
            border-radius: 3px;
            width: 100%;
            font-weight: 500;
        }
        .btn-submit:hover {
            background: #135e96;
            border-color: #135e96;
        }
        .nav-links {
            margin-top: 16px;
            font-size: 13px;
            color: #646970;
            text-align: center;
        }
        .nav-links a {
            color: #2271b1;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-title">WordPress 6.4.2</div>
        
        {% if error_msg %}
        <div class="error-banner">
            <strong>Error:</strong> {{ error_msg }}
        </div>
        {% endif %}

        <div class="login-box">
            <form method="POST" action="/wp-login.php">
                <label for="user_login">Username or Email Address</label>
                <input type="text" name="log" id="user_login" autocomplete="username" required>

                <label for="user_pass">Password</label>
                <input type="password" name="pwd" id="user_pass" autocomplete="current-password" required>

                <button type="submit" name="wp-submit" id="wp-submit" class="btn-submit">Log In</button>
            </form>
        </div>
        <div class="nav-links">
            <p><a href="#">Lost your password?</a> &bull; <a href="/">&larr; Go to Corporate Site</a></p>
        </div>
    </div>
</body>
</html>
