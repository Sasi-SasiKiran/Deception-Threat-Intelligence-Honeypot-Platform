networks:
  attacker-facing:
    driver: bridge
    internal: false
  internal-net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local

services:
  # 1. Nginx Reverse Proxy (Entry Point / Real IP Forwarding)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: honeypot-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - attacker-facing
    depends_on:
      - decoy

  # 2. Decoy Honeypot (FastAPI WordPress & Admin Decoy)
  decoy:
    build:
      context: ./services/decoy
      dockerfile: Dockerfile
    container_name: honeypot-decoy
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - INGEST_SERVICE_URL=${INGEST_SERVICE_URL:-http://ingest:8001/api/v1/events}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-sec_honeypot_internal_token_9f82d17c91a04b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - attacker-facing
      - internal-net
    depends_on:
      - ingest

  # 3. Internal Ingest API (Authentication, Validation, Normalization)
  ingest:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    container_name: honeypot-ingest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-honeypot_admin}:${POSTGRES_PASSWORD:-honeypot_secure_pass_2026!}@${POSTGRES_HOST:-database}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-threat_intelligence}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-sec_honeypot_internal_token_9f82d17c91a04b}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - internal-net
    depends_on:
      database:
        condition: service_healthy

  # 4. PostgreSQL Isolated Database (Threat Intelligence Storage)
  database:
    image: postgres:15-alpine
    container_name: honeypot-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeypot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honeypot_secure_pass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeypot_admin} -d ${POSTGRES_DB:-threat_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Dashboard API (Telemetry, Analytics, Real-time Querying)
  dashboard-api:
    build:
      context: ./services/dashboard-api
      dockerfile: Dockerfile
    container_name: honeypot-dashboard-api
    restart: unless-stopped
    ports:
      - "${DASHBOARD_API_PORT:-8002}:8002"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-honeypot_admin}:${POSTGRES_PASSWORD:-honeypot_secure_pass_2026!}@${POSTGRES_HOST:-database}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-threat_intelligence}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    networks:
      - internal-net
    depends_on:
      database:
        condition: service_healthy

  # 6. Dashboard UI (React + Vite Web Interface)
  dashboard-ui:
    build:
      context: ./services/dashboard-ui
      dockerfile: Dockerfile
    container_name: honeypot-dashboard-ui
    restart: unless-stopped
    ports:
      - "${DASHBOARD_UI_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8002
    networks:
      - internal-net
    depends_on:
      - dashboard-api
